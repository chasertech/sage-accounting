name: publish
concurrency: publish
permissions:
  contents: 'read'
  id-token: 'write'
  pull-requests: 'read'
on:
  push:
    branches:
      - master
jobs:
  main:
    uses: chasertech/github-action-templates/.github/workflows/npm-lib.yaml@0.0.4
    with:
      WORKING_DIR: ./
      NODE_VERSION: "20"
      NPM_GCP_WORKLOAD_IDENTITY_PROVIDER: projects/560514638708/locations/global/workloadIdentityPools/gha-pool/providers/gha-provider
      NPM_GCP_SERVICE_ACCOUNT: chaser-libraries-user@chaser-shared.iam.gserviceaccount.com
